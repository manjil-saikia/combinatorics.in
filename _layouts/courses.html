---
layout: default
---
<main>
  <div class="chead">
    <div class="wrap">
      <p class="eyebrow">{{ page.eyebrow }}</p>
      <h1>{{ page.title }}</h1>
      <p class="lede">{{ page.lede }}</p>
    </div>
  </div>
  <section class="band band--flush">
    <div class="wrap">
      {%- assign courses = site.courses | sort: 'weight' -%}
      <div class="grid">
        {%- for c in courses %}{% include course-card.html course=c %}{% endfor -%}
      </div>
    </div>
  </section>
</main>
