title: combinatorics.in
tagline: Courses in counting, taught in the open.
description: >-
  Lecture logs, problem sets, and references for the combinatorics courses
  taught by Manjil P. Saikia at Ahmedabad University and elsewhere.
url: "https://www.combinatorics.in"
baseurl: ""
lang: en

author:
  name: Manjil P. Saikia
  email: manjil@combinatorics.in
  homepage: https://manjilsaikia.in

collections:
  courses:
    output: true
    permalink: /courses/:name/

defaults:
  - scope: { path: "", type: courses }
    values: { layout: course }
  - scope: { path: "" }
    values: { layout: page }

plugins:
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-seo-tag

kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache
